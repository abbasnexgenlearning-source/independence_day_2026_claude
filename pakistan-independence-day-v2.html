<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abbas NexGen Learning Hub — 14 August</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Poppins:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#020c08;
    --sky-mid:#04160f;
    --pak-green:#00591e;
    --pak-white:#f7fbf6;
    --gold:#ffd166;
    --gold-soft:#ffe9a8;
    --glow:#5bff9b;

    --brand-red:#d81324;
    --brand-red-deep:#8c0000;
    --brand-white:#ffffff;

    --code-bg:#0b0b0d;
    --code-panel:#141416;
    --code-line:#1d1d20;
    --c-comment:#7a7a85;
    --c-key:#ff6b81;
    --c-str:#ffd166;
    --c-fn:#7ee7c7;
    --c-var:#e8e8ec;
    --c-punc:#9a9aa5;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; background:#000; overflow:hidden; font-family:'Poppins',sans-serif; }

  .stage{
    position:relative;
    width:100vw; height:100vh;
    max-width:520px;
    aspect-ratio:9/16;
    margin:0 auto;
    overflow:hidden;
    background:radial-gradient(120% 60% at 50% 0%, var(--sky-mid) 0%, var(--sky-top) 55%, #000 100%);
    box-shadow:0 0 120px rgba(0,0,0,.9);
  }
  @media (max-width:520px){ .stage{ max-width:100vw; height:100vh; aspect-ratio:auto; } }

  /* ================= CODE TERMINAL SCENE ================= */
  .termScene{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:20;
    background:#000;
    animation:sceneWipe .9s ease forwards 5.6s;
  }
  @keyframes sceneWipe{
    to{ clip-path:circle(0% at 50% 50%); }
  }

  .terminal{
    width:88%;
    border-radius:14px;
    background:var(--code-bg);
    border:1px solid rgba(216,19,36,.35);
    box-shadow:0 25px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03);
    opacity:0;
    transform:translateY(18px) scale(.97);
    animation:termIn .7s cubic-bezier(.2,.8,.2,1) forwards .2s;
    overflow:hidden;
  }
  @keyframes termIn{ to{ opacity:1; transform:translateY(0) scale(1); } }

  .termBar{
    display:flex; align-items:center; gap:8px;
    padding:10px 12px;
    background:var(--code-panel);
    border-bottom:1px solid rgba(216,19,36,.3);
  }
  .dot{ width:9px; height:9px; border-radius:50%; }
  .dot.r{ background:var(--brand-red); }
  .dot.w{ background:var(--brand-white); }
  .dot.g{ background:#4a4a52; }
  .tabName{
    margin-left:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:#c7c7cf;
    letter-spacing:.02em;
  }
  .tabName b{ color:var(--brand-red); font-weight:600; }

  .brandBadge{
    margin-left:auto;
    display:flex; align-items:center; gap:6px;
    padding:3px 8px 3px 3px;
    border-radius:999px;
    background:rgba(216,19,36,.12);
    border:1px solid rgba(216,19,36,.4);
    opacity:0;
    animation:riseIn .5s ease forwards .9s;
  }
  .brandBadge .mono{
    width:16px; height:16px; border-radius:50%;
    background:var(--brand-red);
    color:#fff; font-family:'JetBrains Mono',monospace;
    font-size:9px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .brandBadge span{
    font-size:8px; letter-spacing:.09em; color:#f2c6cb; font-weight:600;
    white-space:nowrap;
  }

  .termBody{
    padding:16px 14px 20px;
    font-family:'JetBrains Mono',monospace;
    font-size:clamp(11px,3.1vw,13.5px);
    line-height:1.85;
  }
  .endCard .ring{
    width:54px; height:54px; border-radius:50%;
    background:linear-gradient(135deg, var(--brand-red), var(--brand-red-deep));
    color:#fff; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 30px rgba(216,19,36,.55);
    margin-bottom:4px;
}

  .codeLine{ display:flex; white-space:nowrap; }
  .ln{
    display:inline-block; width:20px; flex:0 0 auto;
    color:#4a4a52; user-select:none; text-align:right; margin-right:12px;
  }
  .reveal{
    display:inline-block; overflow:hidden; white-space:nowrap;
    width:0; border-right:2px solid var(--brand-red);
    animation-name:typeLine; animation-timing-function:steps(var(--chars),end);
    animation-fill-mode:forwards;
  }
  @keyframes typeLine{ to{ width:calc(var(--chars) * 1ch); } }

  .tk-comment{ color:var(--c-comment); font-style:italic; }
  .tk-key{ color:var(--c-key); }
  .tk-str{ color:var(--c-str); }
  .tk-fn{ color:var(--c-fn); }
  .tk-var{ color:var(--c-var); }
  .tk-punc{ color:var(--c-punc); }

  .runLine{
    margin-top:10px;
    color:var(--brand-white);
    opacity:0;
    animation:riseIn .4s ease forwards;
  }
  .runLine .prompt{ color:var(--brand-red); margin-right:8px; }

  .outLine{
    color:#9fe6b8;
    opacity:0;
    font-size:clamp(10.5px,2.9vw,12.5px);
    animation:riseIn .4s ease forwards;
  }
  .outLine .ok{ color:var(--gold); margin-right:6px; }

  @keyframes riseIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ================= STARFIELD / SKY ================= */
  .stars{ position:absolute; inset:0; }
  .star{
    position:absolute; width:2px; height:2px; background:#eafff2; border-radius:50%;
    opacity:0; animation:twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.15; transform:scale(1);} 50%{ opacity:1; transform:scale(1.6);} }

  .moonGlow{
    position:absolute; top:6%; right:12%; width:130px; height:130px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(120,255,180,.12) 45%, transparent 70%);
    opacity:0; animation:fadeGlow 2.5s ease forwards 6.2s; filter:blur(2px);
  }
  @keyframes fadeGlow{ to{ opacity:1; } }

  .skyline{
    position:absolute; bottom:0; left:0; right:0; height:14%;
    background:linear-gradient(180deg, transparent, #000 92%);
    opacity:0; animation:fadeGlow 2s ease forwards 6s;
  }
  .skyline svg{ width:100%; height:100%; display:block; }

  /* ================= FLAG ================= */
  .flagWrap{ position:absolute; left:50%; top:16%; transform:translateX(-50%); width:78%; height:46%; }

  .pole{
    position:absolute; left:6%; top:0; width:5px; height:100%;
    background:linear-gradient(180deg,#d8d8d8,#8a8a8a 60%,#5c5c5c); border-radius:3px;
    transform-origin:bottom; transform:scaleY(0);
    animation:raisePole 1.1s cubic-bezier(.2,.8,.2,1) forwards 6.6s;
    box-shadow:0 0 8px rgba(255,255,255,.3);
  }
  .poleTip{
    position:absolute; left:6%; top:-14px; width:14px; height:14px; margin-left:-4.5px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 55%, #a5780f 100%);
    opacity:0; animation:fadeGlow .6s ease forwards 7.7s; box-shadow:0 0 14px var(--gold);
  }
  @keyframes raisePole{ to{ transform:scaleY(1); } }

  .flagMount{
    position:absolute; left:calc(6% + 3px); top:6%; width:88%; height:60%;
    transform-origin:left center; transform:scaleX(0);
    animation:unfurl 1.4s cubic-bezier(.22,.9,.24,1) forwards 7.65s;
    filter:drop-shadow(0 10px 25px rgba(0,0,0,.55));
  }
  @keyframes unfurl{ to{ transform:scaleX(1); } }

  .flagWave{ width:100%; height:100%; animation:wave 3.4s ease-in-out infinite 9.1s; }
  @keyframes wave{ 0%,100%{ filter:url(#waveFilterA);} 50%{ filter:url(#waveFilterB);} }

  /* ================= HEADLINE ================= */
  .textZone{ position:absolute; left:0; right:0; top:65%; text-align:center; padding:0 8%; }

  .eyebrow{
    font-family:'Poppins',sans-serif; font-weight:500; letter-spacing:.45em; font-size:11px;
    color:var(--gold-soft); text-transform:uppercase; opacity:0;
    animation:riseIn .8s ease forwards 9.2s;
  }

  .count{
    display:flex; align-items:baseline; justify-content:center; gap:10px; margin-top:10px;
    opacity:0; animation:riseIn .8s ease forwards 9.4s;
  }
  .count .num{
    font-family:'Amiri', serif; font-weight:700; font-size:min(23vw,108px); line-height:1;
    background:linear-gradient(180deg, var(--pak-white), #cdeedb 55%, var(--glow));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(91,255,155,.25);
  }
  .count .suffix{
    font-family:'Poppins',sans-serif; font-weight:300; font-size:min(6vw,26px);
    color:var(--pak-white); opacity:.85; text-align:left; line-height:1.15;
  }

  .typewrite{
    margin-top:14px; font-family:'Amiri', serif; font-style:italic; font-size:min(6.6vw,29px);
    color:var(--pak-white); white-space:nowrap; overflow:hidden;
    border-right:2px solid var(--gold); width:0; margin-left:auto; margin-right:auto;
    animation:typing2 1.8s steps(22,end) forwards 10.2s, blink .75s step-end infinite 10.2s;
  }
  @keyframes typing2{ to{ width:15.6ch; } }
  @keyframes blink{ 50%{ border-color:transparent; } }

  .sub{
    margin-top:16px; font-size:12.5px; letter-spacing:.28em; text-transform:uppercase;
    color:rgba(247,251,246,.55); font-weight:400; opacity:0;
    animation:riseIn .9s ease forwards 12.1s;
  }

  /* ================= WATERMARK (persistent institute credit) ================= */
  .watermark{
    position:absolute; left:50%; bottom:5.5%; transform:translateX(-50%);
    display:flex; align-items:center; gap:7px;
    padding:6px 12px; border-radius:999px;
    background:rgba(216,19,36,.14);
    border:1px solid rgba(216,19,36,.5);
    backdrop-filter:blur(3px);
    opacity:0; z-index:9;
    animation:riseIn .8s ease forwards 8.4s;
  }
  .watermark .mono{
    width:16px; height:16px; border-radius:50%; background:var(--brand-red);
    color:#fff; font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .watermark span{ font-size:9.5px; letter-spacing:.14em; color:#ffe1e4; font-weight:600; white-space:nowrap; }

  /* ================= END CARD ================= */
  .endCard{
    position:absolute; inset:0; z-index:15;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; text-align:center; padding:0 12%;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 40%, rgba(0,0,0,.86) 100%);
    opacity:0; pointer-events:none;
    animation:riseIn 1s ease forwards 13.4s;
  }
  .endCard .ring{
    width:54px; height:54px; border-radius:50%;
    background:linear-gradient(135deg, var(--brand-red), var(--brand-red-deep));
    color:#fff; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 30px rgba(216,19,36,.55);
    margin-bottom:4px;
  }
  .endCard h2{
    font-family:'Poppins',sans-serif; font-weight:700; font-size:clamp(15px,4.6vw,20px);
    letter-spacing:.06em; color:#fff; text-transform:uppercase;
  }
  .endCard p{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em;
    color:var(--gold-soft); text-transform:uppercase;
  }

  /* ================= CANVAS LAYERS ================= */
  canvas{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #fireworks{ z-index:5; }
  #confetti{ z-index:6; }

  .vignette{
    position:absolute; inset:0;
    background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);
    pointer-events:none; z-index:7;
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <svg width="0" height="0" style="position:absolute">
    <filter id="waveFilterA" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.01 0.09" numOctaves="2" seed="4" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="waveFilterB" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.012 0.085" numOctaves="2" seed="9" result="turb2"/>
      <feDisplacementMap in="SourceGraphic" in2="turb2" scale="13" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <!-- ============ SCENE 1: CODE TERMINAL (red/white brand) ============ -->
  <div class="termScene" id="termScene">
    <div class="terminal">
      <div class="termBar">
        <span class="dot r"></span><span class="dot w"></span><span class="dot g"></span>
        <span class="tabName">independence.js — <b>Abbas NexGen</b></span>
        <div class="brandBadge">
          <span class="mono">A</span>
          <span>NEXGEN&nbsp;HUB</span>
        </div>
      </div>
      <div class="termBody" id="termBody">
        <!-- lines injected by JS -->
      </div>
    </div>
  </div>

  <!-- ============ SCENE 2: FLAG + FIREWORKS ============ -->
  <div class="stars" id="stars"></div>
  <div class="moonGlow"></div>

  <div class="skyline">
    <svg viewBox="0 0 400 60" preserveAspectRatio="none">
      <path d="M0,60 L0,40 L20,40 L20,25 L35,25 L35,10 L45,10 L45,30 L60,30 L60,18 L62,18 L62,8 L64,8 L64,18 L66,18 L66,32 L85,32 L85,20 L100,20 L100,38 L120,38 L120,15 L125,15 L125,5 L127,5 L127,15 L132,15 L132,38 L150,38 L150,28 L165,28 L165,42 L185,42 L185,12 L188,12 L188,4 L190,4 L190,12 L193,12 L193,42 L210,42 L210,30 L230,30 L230,18 L245,18 L245,40 L265,40 L265,22 L280,22 L280,8 L283,8 L283,22 L300,22 L300,36 L320,36 L320,15 L335,15 L335,40 L355,40 L355,28 L370,28 L370,45 L400,45 L400,60 Z" fill="#000"/>
    </svg>
  </div>

  <div class="flagWrap">
    <div class="pole"></div>
    <div class="poleTip"></div>
    <div class="flagMount">
      <div class="flagWave">
        <svg viewBox="0 0 300 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="75" height="200" fill="#f7fbf6"/>
          <rect x="75" y="0" width="225" height="200" fill="#00591e"/>
          <circle cx="205" cy="95" r="52" fill="#f7fbf6"/>
          <circle cx="222" cy="95" r="44" fill="#00591e"/>
          <polygon fill="#f7fbf6" points="255,95 240,101 243,84 230,71 247,73 255,58 261,74 278,72 265,85 269,101"/>
        </svg>
      </div>
    </div>
  </div>

  <canvas id="fireworks"></canvas>
  <canvas id="confetti"></canvas>

  <div class="textZone">
    <div class="eyebrow">Independence Day</div>
    <div class="count">
      <span class="num" id="counter">0</span>
      <span class="suffix">YEARS<br>OF AZADI</span>
    </div>
    <div class="typewrite">Pakistan Zindabad</div>
    <div class="sub">14th August · 1947</div>
  </div>

  <div class="watermark">
    <span class="mono">A</span>
    <span>ABBAS NEXGEN LEARNING HUB</span>
  </div>

  <div class="vignette"></div>

 <!--  <div class="endCard">
    <div class="ring">Abbas</div>
    <h2>Abbas NexGen Learning Hub</h2>
    <p>Code &nbsp;·&nbsp; Learn &nbsp;·&nbsp; Grow &nbsp;✦&nbsp; Sal Mubarak</p>
  </div>
</div> -->

<script>
// ---------- CODE TYPING (terminal scene) ----------
const lines = [
  [{t:'// Abbas NexGen Learning Hub', c:'tk-comment'}],
  [{t:'const ',c:'tk-key'},{t:'country ',c:'tk-var'},{t:'= ',c:'tk-punc'},{t:'"Pakistan"',c:'tk-str'},{t:';',c:'tk-punc'}],
  [{t:'const ',c:'tk-key'},{t:'azadiYear ',c:'tk-var'},{t:'= ',c:'tk-punc'},{t:'1947',c:'tk-str'},{t:';',c:'tk-punc'}],
  [{t:'const ',c:'tk-key'},{t:'years ',c:'tk-var'},{t:'= ',c:'tk-punc'},{t:'thisYear',c:'tk-fn'},{t:' - azadiYear;',c:'tk-punc'}],
  [{t:'console',c:'tk-fn'},{t:'.log',c:'tk-punc'},{t:'(',c:'tk-punc'},{t:'`Happy Independence Day 🇵🇰 ${years} years`',c:'tk-str'},{t:')',c:'tk-punc'},{t:';',c:'tk-punc'}],
];

const termBody = document.getElementById('termBody');
let delay = 0;
const perCharMs = 26;

lines.forEach((tokens, idx)=>{
  const lineEl = document.createElement('div');
  lineEl.className = 'codeLine';

  const lnEl = document.createElement('span');
  lnEl.className = 'ln';
  lnEl.textContent = idx+1;
  lineEl.appendChild(lnEl);

  const reveal = document.createElement('span');
  reveal.className = 'reveal';
  const totalChars = tokens.reduce((a,t)=>a+t.t.length,0);
  reveal.style.setProperty('--chars', totalChars);
  const dur = Math.max(totalChars*perCharMs, 200);
  reveal.style.animationDuration = dur+'ms';
  reveal.style.animationDelay = delay+'ms';

  tokens.forEach(tok=>{
    const span = document.createElement('span');
    span.className = tok.c;
    span.textContent = tok.t;
    reveal.appendChild(span);
  });

  lineEl.appendChild(reveal);
  termBody.appendChild(lineEl);

  delay += dur + 90;
});

// run + output lines appear after typing finishes
const runLine = document.createElement('div');
runLine.className = 'runLine';
runLine.innerHTML = '<span class="prompt">$</span>node independence.js';
runLine.style.animationDelay = (delay+150)+'ms';
termBody.appendChild(runLine);
delay += 150;

const outputs = [
  'Compiling 79 years of freedom...',
  'Build successful',
  'Pakistan Zindabad 🇵🇰'
];
outputs.forEach((txt,i)=>{
  const o = document.createElement('div');
  o.className = 'outLine';
  o.innerHTML = '<span class="ok">✔</span>' + txt;
  o.style.animationDelay = (delay + 350 + i*380)+'ms';
  termBody.appendChild(o);
});

// ---------- STARS ----------
const starsEl = document.getElementById('stars');
for(let i=0;i<90;i++){
  const s = document.createElement('div');
  s.className='star';
  s.style.left = Math.random()*100+'%';
  s.style.top = Math.random()*55+'%';
  s.style.animationDelay = (Math.random()*3.5)+'s';
  s.style.animationDuration = (2.5+Math.random()*3)+'s';
  starsEl.appendChild(s);
}

// ---------- COUNTER ----------
const counterEl = document.getElementById('counter');
const target = new Date().getFullYear() - 1947 + (new Date() >= new Date(new Date().getFullYear(),7,14) ? 1 : 0);
let started = false;
function runCounter(){
  if(started) return; started = true;
  const dur = 1200, startT = performance.now();
  function tick(now){
    const p = Math.min(1,(now-startT)/dur);
    const eased = 1 - Math.pow(1-p,3);
    counterEl.textContent = Math.round(eased*target);
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
setTimeout(runCounter, 9400);

// ---------- CANVAS SETUP ----------
const stage = document.getElementById('stage');
function fitCanvas(c){ const r = stage.getBoundingClientRect(); c.width = r.width; c.height = r.height; }
const fwCanvas = document.getElementById('fireworks');
const cfCanvas = document.getElementById('confetti');
const fwCtx = fwCanvas.getContext('2d');
const cfCtx = cfCanvas.getContext('2d');
function resizeAll(){ fitCanvas(fwCanvas); fitCanvas(cfCanvas); }
resizeAll();
window.addEventListener('resize', resizeAll);

// ---------- FIREWORKS ----------
const palette = ['#f7fbf6','#5bff9b','#ffd166','#00c853','#ffffff'];
let fireworks = [];
function spawnFirework(x, y){
  const count = 46 + Math.floor(Math.random()*20);
  const color = palette[Math.floor(Math.random()*palette.length)];
  const particles = [];
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2*i)/count + Math.random()*0.2;
    const speed = 2 + Math.random()*3.2;
    particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life:1, decay:0.008+Math.random()*0.012, color });
  }
  fireworks.push(particles);
}
function updateFireworks(){
  fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height);
  fwCtx.globalCompositeOperation = 'lighter';
  fireworks.forEach(particles=>{
    particles.forEach(p=>{
      p.vy += 0.028; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
      if(p.life>0){
        fwCtx.beginPath(); fwCtx.globalAlpha = Math.max(p.life,0);
        fwCtx.fillStyle = p.color; fwCtx.arc(p.x,p.y,2.1,0,Math.PI*2); fwCtx.fill();
      }
    });
  });
  fireworks = fireworks.filter(particles=>particles.some(p=>p.life>0));
  fwCtx.globalAlpha = 1; fwCtx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(updateFireworks);
}
updateFireworks();
function fireworksLoop(){
  const w = fwCanvas.width, h = fwCanvas.height;
  spawnFirework(w*(0.2+Math.random()*0.6), h*(0.16+Math.random()*0.28));
  setTimeout(fireworksLoop, 650+Math.random()*700);
}
setTimeout(fireworksLoop, 9100);

// ---------- CONFETTI ----------
const confettiColors = ['#00591e','#f7fbf6','#ffd166','#5bff9b'];
let confetti = [];
function spawnConfettiBatch(n){
  const w = cfCanvas.width;
  for(let i=0;i<n;i++){
    confetti.push({
      x: Math.random()*w, y: -20-Math.random()*200, size:4+Math.random()*5,
      speedY:1+Math.random()*2.2, speedX:(Math.random()-0.5)*1.4,
      rot: Math.random()*360, rotSpeed:(Math.random()-0.5)*8,
      color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
      shape: Math.random()>0.5?'rect':'circle'
    });
  }
}
function updateConfetti(){
  cfCtx.clearRect(0,0,cfCanvas.width,cfCanvas.height);
  confetti.forEach(c=>{
    c.y += c.speedY; c.x += c.speedX + Math.sin(c.y*0.02); c.rot += c.rotSpeed;
    cfCtx.save(); cfCtx.translate(c.x,c.y); cfCtx.rotate(c.rot*Math.PI/180);
    cfCtx.fillStyle = c.color;
    if(c.shape==='rect'){ cfCtx.fillRect(-c.size/2,-c.size/3,c.size,c.size*0.6); }
    else { cfCtx.beginPath(); cfCtx.arc(0,0,c.size/2,0,Math.PI*2); cfCtx.fill(); }
    cfCtx.restore();
  });
  confetti = confetti.filter(c=>c.y < cfCanvas.height+30);
  requestAnimationFrame(updateConfetti);
}
updateConfetti();
setTimeout(()=>{ setInterval(()=>spawnConfettiBatch(6), 400); }, 10000);
</script>
